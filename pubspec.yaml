name: flowlines
description: Flow Lines by Wajiha - connect the pipes, flood the board.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  in_app_purchase: ^3.2.0
  share_plus: ^13.3.1
  in_app_review: ^2.0.12
  qr_flutter: '>=4.1.0 <5.0.0'
  mobile_scanner: '>=5.2.3 <6.0.0'
  file_picker: '>=13.0.0 <14.0.0'
  path_provider: '>=2.1.4 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/flowlines_logo.png
    - assets/wajiha_logo.png
